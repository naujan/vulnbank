<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VulnBank - {% block title %}{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- HEADER -->
    <header>
        <section class="header_container">
                <section class="logo">
                    <a class="logo_link_container" href="{{ url_for('pages.home')}}"> 
                        <p class="logo_text"><span class="logo_vuln">Vuln</span>Bank</p>
                        <p class="slogan">Unsafest out there!</p>
                    </a>
                </section>
            <section class="navigation">
                <nav>
                    <a href="{{ url_for('pages.home')}}">Home</a>
                    <a href="{{ url_for('pages.about')}}">About</a>
                    <a href="{{ url_for('pages.contact')}}">Contact</a>
                    <a href="{{ url_for('pages.account')}}">Account</a>
                </nav>
            </section>
        </section>
    </header>
    <!-- CONTENT -->
    <main>
    {% block content %}{% endblock %}
    </main>
    <!-- FOOTER -->
    <footer>

    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
